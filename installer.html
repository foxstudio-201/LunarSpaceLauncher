<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self' file:; script-src 'self' file: 'unsafe-inline'; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data: blob:; font-src 'self' file: data:; connect-src 'self' file:; object-src 'none'; base-uri 'self'; form-action 'none'"
  />
  <title>LunarSpace Launcher - Trình cài đặt</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <script>
    (function () {
      var q = new URLSearchParams(location.search)
      var theme = q.get('theme') === 'light' ? 'light' : 'dark'
      var lang = q.get('lang') === 'en' ? 'en' : 'vi'
      var skin = q.get('skin') === 'pixel' ? 'pixel' : 'default'
      document.documentElement.setAttribute('data-theme', theme)
      document.documentElement.setAttribute('data-skin', skin)
      window.__boot = { theme: theme, lang: lang, skin: skin }
    })()
  </script>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      background: #0a0a0a;
    }
    html[data-theme="light"], html[data-theme="light"] body {
      background: #f5f5f5;
    }
    html[data-skin="pixel"], html[data-skin="pixel"] body {
      background: #0a0d12;
    }
    html[data-skin="pixel"][data-theme="light"], html[data-skin="pixel"][data-theme="light"] body {
      background: #edf2f9;
    }
    .license-text,
    .license-text * {
      overflow-anchor: none;
    }
  </style>
</head>
<body>
  <div id="installer-root"></div>
  <script type="module" src="/src/installer/main.jsx"></script>
</body>
</html>
