name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node -e "const fs=require('fs');const v=process.env.GITHUB_REF_NAME.replace(/^v/,'');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=v;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+String.fromCharCode(10));console.log('build version',v)"

      - name: Build ${{ matrix.platform }}
        run: npm run electron:build -- --${{ matrix.platform }} --publish never

      - name: Generate update feed
        if: matrix.platform == 'win'
        run: node scripts/latest-yml.cjs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-artifacts
          if-no-files-found: error
          path: |
            dist-electron/*.exe
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.yml
            dist-electron/*.blockmap

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List files
        run: ls -lhR artifacts

      - name: Resolve latest flag
        id: latest
        shell: bash
        run: |
          highest=$(git ls-remote --tags https://github.com/${{ github.repository }}.git 'refs/tags/v*' | sed 's#.*refs/tags/##' | grep -v '\^{}' | sort -V | tail -1)
          echo "highest tag: $highest, this tag: $GITHUB_REF_NAME"
          if [ -z "$highest" ]; then echo "make_latest=legacy" >> "$GITHUB_OUTPUT"
          elif [ "$highest" = "$GITHUB_REF_NAME" ]; then echo "make_latest=true" >> "$GITHUB_OUTPUT"
          else echo "make_latest=false" >> "$GITHUB_OUTPUT"; fi

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          draft: false
          make_latest: ${{ steps.latest.outputs.make_latest }}
          body: |
            # XyoLauncher 2.0.1

            Bản cập nhật tập trung vào trải nghiệm mở launcher lần đầu, đồng bộ dữ liệu từ LunarSpace Launcher và luồng khởi động mới.

            ![Đăng nhập lần đầu](https://raw.githubusercontent.com/foxstudio-201/LunarSpaceLauncher/main/docs/screenshots/onboarding.png)

            ## Đăng nhập lần đầu
            - Màn hình đăng nhập riêng sau splash với nền cảnh đêm thuật toán: sao nhấp nháy, dải Ngân Hà, mặt trăng, mây trôi, núi và mặt biển động.
            - 4 cách đăng nhập: **Ngoại tuyến**, **Microsoft**, **ely.by**, **Discord** — dùng icon thương hiệu thật.
            - Hiệu ứng chuyển loại tài khoản, head skin cập nhật khi gõ tên, trạng thái chờ xác minh và màn chào khi hoàn tất.
            - Chưa có tài khoản: màn đăng nhập luôn hiện lại mỗi lần mở (kể cả đã bỏ qua). Đã đăng nhập: không hiện nữa.

            ## Chào mừng trở lại
            - Khi đã có tài khoản, launcher hiện toast **Đăng nhập thành công** kèm head skin thật và lời chào.

            ![Toast chào mừng](https://raw.githubusercontent.com/foxstudio-201/LunarSpaceLauncher/main/docs/screenshots/welcome-toast.png)

            ## Đồng bộ dữ liệu LunarSpace Launcher
            - Phát hiện dữ liệu launcher cũ và hỏi một lần: **Đồng bộ** (chép instances, skins, cấu hình, shared…) hoặc **Không đồng bộ** (xoá dữ liệu cũ).
            - Hiệu ứng quỹ đạo hành tinh, tiến trình đếm tệp, huỷ giữa chừng và đồng bộ lại.

            ![Đồng bộ dữ liệu cũ](https://raw.githubusercontent.com/foxstudio-201/LunarSpaceLauncher/main/docs/screenshots/legacy-sync.png)

            ## Khởi động mượt, không lộ màn hình chính
            - Splash → loading (%) → đăng nhập (nếu cần) → **tối dần** → **tách màn** chạy sau cùng.
            - Chữ và thanh loading ẩn hẳn trước khi tách màn; không còn khung hình lộ giao diện chính giữa các bước.
            - Áp dụng cho cả đăng nhập, bỏ qua và trường hợp đã có tài khoản.

            ## Khác
            - Logo XyoLauncher cho màn đăng nhập; viền focus ô nhập trung tính.
            - Nâng phiên bản lên 2.0.1.
