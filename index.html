<!DOCTYPE html>
<html lang="vi" data-skin="xyo">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self' file:; script-src 'self' file: 'unsafe-inline'; worker-src 'self' file: blob:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data: blob: https: lsicon: lsmap: lsbg:; font-src 'self' file: data:; connect-src 'self' file: http://localhost:* ws://localhost:* wss://localhost:* http://127.0.0.1:* ws://127.0.0.1:* https:; object-src 'none'; base-uri 'self'; form-action 'none'"
  />
  <title>XyoLauncher</title>
  <link rel="icon" type="image/png" href="./favicon.png" />
  <script>
    (function () {
      var q = new URLSearchParams(location.search)
      var theme = q.get('theme') === 'light' ? 'light' : q.get('theme') === 'dark' ? 'dark' : ''
      var lang = q.get('lang') === 'en' ? 'en' : q.get('lang') === 'vi' ? 'vi' : ''
      if (theme) document.documentElement.setAttribute('data-theme', theme)
      document.documentElement.setAttribute('data-skin', 'xyo')
      window.__boot = { theme: theme || 'dark', lang: lang || 'vi' }
    })()
  </script>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      background: #0c0e12;
    }
    html[data-theme="light"], html[data-theme="light"] body {
      background: #f4f5f8;
    }
    html[data-skin="xyo"] body {
      font-family: 'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif;
    }

    /* Khung chờ trước khi React kịp mount: trùng khít splash của bản Rust (frame đầu + nền tối). */
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0c0e12 url('./splash/frame_001.jpg') center / cover no-repeat;
    }
    #boot-splash .boot-spinner {
      width: 20px;
      height: 20px;
      border-radius: 999px;
      border: 2px solid rgba(233, 184, 114, 0.22);
      border-top-color: #e9b872;
      animation: boot-spin 0.8s linear infinite;
    }
    @keyframes boot-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="boot-splash"><span class="boot-spinner" aria-hidden="true"></span></div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
