[package]
name = "xyolauncher"
version = "2.0.0"
edition = "2024"
description = "XyoLauncher - Minecraft launcher client"
authors = ["XyoLauncher"]
build = "build.rs"

[[bin]]
name = "XyoLauncher"
path = "src/main.rs"

[dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "windows-manifest"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "charset", "http2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "time", "sync", "io-util"] }
futures-util = "0.3"
async-channel = "2"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
zip = { version = "9", default-features = false, features = ["deflate", "bzip2"] }
flate2 = "1"
tar = "0.4"
base64 = "0.22"
regex = "1"
open = "5"
sysinfo = "0.33"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_LibraryLoader"] }
discord-rich-presence = "0.2"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
once_cell = "1"
parking_lot = "0.12"
unicode-segmentation = "1"
rfd = "0.15"
html-escape = "0.2"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
